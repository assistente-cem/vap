    let currentActiveDate = appData.schedule[0].date;

    // Funções de Inicialização e Renderização
    function initApp() {
      renderTabs();
      renderSchedule(currentActiveDate);
      setInterval(updateIndicator, 60000); // Atualiza indicador a cada minuto
      updateIndicator();
    }

    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';
      
      appData.schedule.forEach(day => {
        const isActive = day.date === currentActiveDate;
        const btn = document.createElement('button');
        btn.className = `min-h-[48px] px-5 py-2 rounded-full whitespace-nowrap font-semibold text-sm transition-all duration-300 ${isActive ? 'bg-navy text-white shadow-md' : 'bg-transparent text-gray-500 border border-gray-300'}`;
        btn.innerHTML = `<span class="block text-xs font-normal opacity-80">${day.dayWeek}</span>${day.label}`;
        btn.onclick = () => {
          currentActiveDate = day.date;
          renderTabs();
          renderSchedule(day.date);
        };
        container.appendChild(btn);
      });
    }

    function getMapsLink(loc) {
      if (!loc || loc.trim() === '') return '#';
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc)}`;
    }

    function renderSchedule(dateStr) {
      const container = document.getElementById('schedule-container');
      container.innerHTML = '';
      
      const dayData = appData.schedule.find(d => d.date === dateStr);
      if (!dayData) return;

      dayData.events.forEach(event => {
        const mapLinkHTML = event.location 
          ? `<a href="${getMapsLink(event.location)}" target="_blank" class="text-blue-600 text-sm mt-2 flex items-center gap-1 active:opacity-70 min-h-[32px] w-max p-1 -ml-1 rounded"><i class="fas fa-map-marker-alt"></i> ${event.location}</a>`
          : `<span class="text-gray-400 text-sm mt-2 flex items-center gap-1"><i class="fas fa-map-marker-alt"></i> Local não definido</span>`;

        const html = `
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 relative event-card" data-time="${event.time}">
            <div class="flex justify-between items-start mb-2">
              <span class="text-navy font-bold text-2xl tracking-tight">${event.time.replace(':', 'h')}</span>
              <button onclick="openModal('uniformes')" class="bg-gold/20 text-navy-dark text-xs font-bold px-3 py-1.5 rounded-full min-h-[32px] active:bg-gold/40 transition">
                ${event.uniform || 'Passeio'}
              </button>
            </div>
            <h3 class="font-semibold text-gray-800 text-base leading-snug cursor-pointer" onclick="openEventDetails('${event.id}')">${event.title}</h3>
            ${mapLinkHTML}
            <button onclick="openEventDetails('${event.id}')" class="absolute inset-0 w-full h-full opacity-0" aria-label="Detalhes de ${event.title}"></button>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });

      // Atualiza imediatamente o indicador ao trocar de aba
      updateIndicator();
    }

    /**
     * LÓGICA DO INDICADOR "AGORA"
     */
    function updateIndicator() {
      // Remove indicadores existentes
      document.querySelectorAll('.now-indicator-line').forEach(el => el.remove());
      
      // Hora e Data Real do Sistema
      const now = new Date();
      
      // Formata YYYY-MM-DD local
      const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      
      // Só desenha a linha se a aba ativa for o dia de hoje
      if (currentActiveDate !== todayStr) return;

      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const cards = document.querySelectorAll('.event-card');
      let inserted = false;

      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const timeStr = card.getAttribute('data-time'); // "HH:MM" ou "HH:MM*"
        const [h, m] = timeStr.replace('*', '').split(':').map(Number);
        const eventMinutes = (h * 60) + m;

        const nextCard = cards[i + 1];
        let nextEventMinutes = 24 * 60; // Fim do dia
        
        if (nextCard) {
          const nextTimeStr = nextCard.getAttribute('data-time');
          const [nh, nm] = nextTimeStr.replace('*', '').split(':').map(Number);
          nextEventMinutes = (nh * 60) + nm;
        }

        // Se a hora atual está entre este evento e o próximo
        if (currentMinutes >= eventMinutes && currentMinutes < nextEventMinutes) {
          const indicatorHTML = `
            <div class="now-indicator-line" style="top: 0px;">
              <div class="now-indicator-dot"></div>
            </div>
          `;
          card.style.position = 'relative';
          // Injeta a linha no topo do cartão ativo
          card.insertAdjacentHTML('afterbegin', indicatorHTML);
          inserted = true;
          break;
        }
      }

      // Se for antes do primeiro evento do dia
      if (!inserted && cards.length > 0) {
        const [h0, m0] = cards[0].getAttribute('data-time').replace('*', '').split(':').map(Number);
        if (currentMinutes < (h0 * 60)) {
          cards[0].insertAdjacentHTML('beforebegin', `
            <div class="now-indicator-line relative my-2 w-full">
              <div class="now-indicator-dot"></div>
            </div>
          `);
        }
      }
    }

    /**
     * MODAIS E INTERFACES (Bottom Sheet)
     */
    function openModal(type) {
      const modalBody = document.getElementById('modal-body');
      let content = '';

      if (type === 'autoridades') {

        });

      } else if (type === 'acomodacao') {
        content = `<h2 class="text-xl font-bold text-navy mb-4"><i class="fas fa-bed mr-2 text-gold"></i> Acomodações</h2><ul class="space-y-3">`;

      } else if (type === 'uniformes') {
        content = `<h2 class="text-xl font-bold text-navy mb-4"><i class="fas fa-tshirt mr-2 text-gold"></i> Planilha de Uniformes</h2><div class="space-y-2">`;
        appData.logistics.uniformes.forEach(u => {
          content += `<div class="bg-gray-50 p-3 rounded-lg border border-gray-100"><span class="inline-block bg-navy text-white text-xs px-2 py-1 rounded mb-1 font-bold">${u.id}</span><p class="text-sm text-gray-700">${u.desc}</p></div>`;
        });
        content += `</div>`;
      } else if (type === 'viaturas') {
        content = `<h2 class="text-xl font-bold text-navy mb-4"><i class="fas fa-car mr-2 text-gold"></i> Logística de Viaturas</h2><div class="space-y-3">`;
        appData.logistics.viaturas.forEach(v => {
          content += `<div class="bg-gray-50 p-3 rounded-lg border border-gray-100 flex justify-between items-center">
            <div><p class="font-bold text-gray-800">${v.prefixo} <span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded ml-1">${v.placa}</span></p><p class="text-sm text-gray-600">${v.tipo} | Motorista: ${v.motorista}</p></div>
          </div>`;
        });
        content += `</div>`;
      } else if (type === 'contatos') {
        content = `<h2 class="text-xl font-bold text-navy mb-4"><i class="fas fa-phone-alt mr-2 text-gold"></i> Contatos da Coordenação</h2><div class="space-y-3">`;
        appData.logistics.contatos.forEach(c => {
          content += `<div class="bg-gray-50 p-3 rounded-lg border border-gray-100 flex flex-col gap-2">
            <div><p class="font-bold text-gray-800">${c.nome}</p><p class="text-sm text-gray-600 font-mono">${c.display}</p></div>
            <div class="flex gap-2">
              <a href="tel:+${c.tel}" class="flex-1 bg-navy text-white text-center py-2 rounded-lg text-sm font-semibold min-h-[44px] flex items-center justify-center gap-2 active:bg-navy-dark"><i class="fas fa-phone"></i> Ligar</a>
              <a href="https://wa.me/${c.tel}" target="_blank" class="flex-1 bg-green-600 text-white text-center py-2 rounded-lg text-sm font-semibold min-h-[44px] flex items-center justify-center gap-2 active:bg-green-700"><i class="fab fa-whatsapp text-lg"></i> WhatsApp</a>
            </div>
          </div>`;
        });
        content += `</div>`;
      }

      modalBody.innerHTML = content;
      document.getElementById('bottom-sheet').classList.add('active');
    }

    function openEventDetails(eventId) {
      let evData = null;
      let evDate = null;
      
      appData.schedule.forEach(d => {
        const found = d.events.find(e => e.id === eventId);
        if (found) {
          evData = found;
          evDate = d.label;
        }
      });

      if (!evData) return;

      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-2xl font-bold text-navy">${evData.time.replace(':', 'h')}</h2>
          <span class="text-sm text-gray-500 font-semibold">${evDate}</span>
        </div>
        <h3 class="text-lg font-bold text-gray-800 mb-4">${evData.title}</h3>
        <div class="space-y-4">
          ${evData.location ? `
            <div>
              <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1">Local</p>
              <a href="${getMapsLink(evData.location)}" target="_blank" class="flex items-center gap-2 text-blue-600 bg-blue-50 p-3 rounded-lg min-h-[48px] font-medium active:bg-blue-100 transition">
                <i class="fas fa-map-marker-alt text-lg"></i> ${evData.location}
                <i class="fas fa-external-link-alt ml-auto text-sm opacity-50"></i>
              </a>
            </div>
          ` : ''}
          <div>
            <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1">Uniforme / Traje</p>
            <div class="bg-gray-50 p-3 rounded-lg font-medium text-gray-800 flex items-center gap-2">
              <i class="fas fa-tshirt text-gray-400"></i> ${evData.uniform || 'Não especificado'}
            </div>
          </div>
          ${evData.obs ? `
            <div>
              <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1">Observações e Participantes</p>
              <div class="bg-yellow-50/50 border border-yellow-100 p-3 rounded-lg text-sm text-gray-700 whitespace-pre-wrap">
                ${evData.obs}
              </div>
            </div>
          ` : ''}
        </div>
      `;
      document.getElementById('bottom-sheet').classList.add('active');
    }

    function closeModal() {
      document.getElementById('bottom-sheet').classList.remove('active');
    }

    // Inicializar aplicação
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
